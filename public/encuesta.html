<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta de Satisfacción · Mastermind Million</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#08080A;
    --gold:#C8A24A;
    --gold-bright:#F0DFA8;
    --gold-dim:rgba(200,162,74,.22);
    --bone:#F2EEE6;
    --muted:#8A857C;
    --err:#C4553E;
    --font:"Poppins", -apple-system, system-ui, sans-serif;
    --lux:linear-gradient(100deg,#8A6A22 0%,#C8A24A 20%,#F7EAC2 44%,#E0C271 58%,#B98F35 78%,#8A6A22 100%);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh}

  body{
    background:var(--ink);
    color:var(--bone);
    font-family:var(--font);
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(80vw 60vh at 12% -10%, rgba(200,162,74,.11), transparent 60%),
      radial-gradient(50vw 40vh at 100% 110%, rgba(200,162,74,.06), transparent 65%);
    pointer-events:none;z-index:0;
  }

  .lux-text{
    background:var(--lux);
    background-size:180% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .stage{
    position:relative;z-index:1;height:100%;
    display:flex;align-items:flex-start;justify-content:center;
    padding:96px 32px 120px;
    overflow-y:auto;
  }
  .card{width:100%;max-width:680px;margin:auto 0}
  .card.enter{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .card.leave{animation:sink .22s ease-in both}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes sink{from{opacity:1}to{opacity:0;transform:translateY(-14px)}}


  /* ---------- imagotipo ---------- */
  .mark{display:block;width:auto;image-rendering:auto}
  .mark.lg{height:64px;margin-bottom:26px}
  .mark.done{height:46px;margin-bottom:22px;opacity:.9}

  /* ---------- barra superior ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:3;
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 32px;
    font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);
  }
  .brand{color:var(--bone);font-weight:500}
  .brand b{font-weight:900;letter-spacing:.04em;font-size:11.5px}

  /* ---------- pregunta ---------- */
  .eyebrow{
    font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    display:flex;align-items:center;gap:12px;margin-bottom:26px;color:var(--gold);
  }
  .eyebrow .rule{flex:1;height:1px;max-width:120px;background:var(--lux);opacity:.5}

  .q{
    font-weight:900;
    font-size:clamp(1.4rem,3.4vw,2.05rem);
    line-height:1.16;letter-spacing:-.03em;margin-bottom:16px;
  }
  .q .opt{
    font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);vertical-align:middle;margin-left:12px;
    border:1px solid var(--gold-dim);border-radius:2px;padding:4px 8px;
  }
  .help{font-size:.92rem;font-weight:300;line-height:1.6;color:var(--muted);margin-bottom:34px;max-width:52ch}
  .help:empty{display:none;margin:0}

  /* ---------- campos ---------- */
  .field{
    width:100%;background:transparent;border:0;
    border-bottom:1px solid var(--gold-dim);
    color:var(--bone);font-family:var(--font);font-weight:400;
    font-size:clamp(1.02rem,2.3vw,1.25rem);
    padding:10px 2px 14px;outline:none;transition:border-color .25s ease;
  }
  .field::placeholder{color:#4A473F;font-weight:300}
  .field:focus{border-bottom-color:var(--gold)}
  textarea.field{resize:none;min-height:0;height:auto;line-height:1.6;overflow:hidden}

  /* ---------- escala 1–10 ---------- */
  .scale{display:flex;gap:8px;flex-wrap:wrap}
  .dot{
    flex:1 1 0;min-width:46px;height:56px;
    background:rgba(255,255,255,.015);
    border:1px solid var(--gold-dim);border-radius:3px;
    color:var(--bone);font-family:var(--font);font-weight:700;font-size:1rem;
    cursor:pointer;
    transition:border-color .16s ease,background .16s ease,transform .16s ease,color .16s ease;
  }
  .dot:hover{border-color:rgba(200,162,74,.6);background:rgba(200,162,74,.08);transform:translateY(-2px)}
  .dot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .dot[aria-checked="true"]{
    background:var(--lux);background-size:160% auto;
    border-color:transparent;color:#0A0A0A;font-weight:900;
  }
  .scale-legend{
    display:flex;justify-content:space-between;
    font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin-top:14px;
  }


  /* ---------- escala compacta (producción) ---------- */
  .mrow{
    margin-bottom:26px;padding-bottom:24px;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .mrow:last-of-type{border-bottom:0;padding-bottom:0;margin-bottom:8px}
  .mrow .lbl{
    display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--bone);margin-bottom:13px;
  }
  .mrow .scale{gap:7px}
  .mrow .dot{height:46px;min-width:0;font-size:.88rem;font-weight:600}

  /* ---------- opciones ---------- */
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt-btn{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:rgba(255,255,255,.015);border:1px solid var(--gold-dim);border-radius:3px;
    color:var(--bone);font-family:var(--font);font-size:.95rem;font-weight:400;
    padding:15px 18px;cursor:pointer;
    transition:border-color .18s ease,background .18s ease;
  }
  .opt-btn:hover{border-color:rgba(200,162,74,.55);background:rgba(200,162,74,.06)}
  .opt-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .opt-btn .key{
    width:24px;height:24px;flex:none;display:grid;place-items:center;
    border:1px solid var(--gold-dim);border-radius:2px;
    font-size:10.5px;font-weight:600;color:var(--gold);
  }
  .opt-btn[aria-checked="true"]{border-color:var(--gold);background:rgba(200,162,74,.12)}
  .opt-btn[aria-checked="true"] .key{background:var(--lux);background-size:160% auto;border-color:transparent;color:#0A0A0A;font-weight:900}

  /* ---------- referidos ---------- */
  .ref{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px;align-items:end}
  .ref .n{
    font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    grid-column:1 / -1;margin-bottom:-8px;
  }
  .ref .field{font-size:.98rem}

  /* ---------- acciones ---------- */
  .actions{display:flex;align-items:center;gap:18px;margin-top:34px;flex-wrap:wrap}
  .go{
    font-family:var(--font);font-weight:700;font-size:.9rem;letter-spacing:.01em;
    background:var(--lux);background-size:200% auto;background-position:0% center;
    color:#0A0A0A;border:0;border-radius:3px;
    padding:14px 28px;cursor:pointer;
    transition:background-position .45s ease,transform .18s ease;
  }
  .go:hover{background-position:100% center;transform:translateY(-1px)}
  .go:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
  .hint{font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .hint kbd{border:1px solid var(--gold-dim);border-radius:2px;padding:2px 6px;color:var(--gold);font-family:var(--font);font-size:10px}
  .skip{
    background:none;border:0;color:var(--muted);font-family:var(--font);
    font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    cursor:pointer;text-decoration:underline;text-underline-offset:4px;
  }
  .skip:hover{color:var(--gold)}
  .error{color:var(--err);font-size:.82rem;font-weight:400;margin-top:14px;min-height:1.1em;letter-spacing:.02em}

  /* ---------- pie: solo barra de progreso ---------- */
  .footbar{
    position:fixed;left:0;right:0;bottom:0;z-index:3;
    padding:22px 32px 26px;
    display:flex;align-items:center;gap:20px;
    background:linear-gradient(to top, var(--ink) 60%, transparent);
  }
  .bar{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
  .bar .fill{
    height:100%;width:0;border-radius:2px;
    background:var(--lux);background-size:200% auto;
    transition:width .5s cubic-bezier(.2,.7,.3,1);
  }
  .steps{
    font-size:10.5px;font-weight:600;letter-spacing:.18em;color:var(--muted);
    min-width:56px;text-align:right;font-variant-numeric:tabular-nums;
  }
  .nav{display:flex;gap:8px}
  .nav button{
    width:34px;height:30px;background:transparent;border:1px solid var(--gold-dim);
    border-radius:3px;color:var(--gold);cursor:pointer;font-size:12px;
    transition:border-color .18s ease,background .18s ease;
  }
  .nav button:hover:not(:disabled){border-color:var(--gold);background:rgba(200,162,74,.1)}
  .nav button:disabled{opacity:.3;cursor:default}

  /* ---------- portada y cierre ---------- */
  .kicker{font-size:10.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;margin-bottom:22px}
  .title{
    font-weight:900;
    font-size:clamp(2rem,5.6vw,3.3rem);
    line-height:1.02;letter-spacing:-.045em;margin-bottom:24px;
  }
  .lede{font-size:1rem;font-weight:300;line-height:1.7;color:#B9B4AA;max-width:50ch;margin-bottom:16px}



  @media (max-width:640px){
    .topbar{display:none}

    .stage{padding:44px 20px 116px}
    .card{margin:auto 0}

    .mark.lg{height:46px;margin-bottom:18px}
    .mark.done{height:40px;margin-bottom:18px}

    .title{font-size:clamp(1.9rem,9vw,2.4rem);letter-spacing:-.035em}
    .lede{font-size:.95rem}
    .kicker{letter-spacing:.24em;margin-bottom:16px}

    .eyebrow{margin-bottom:20px;font-size:10px;letter-spacing:.18em}
    .eyebrow .rule{max-width:40px}
    .q{font-size:1.32rem;line-height:1.24;margin-bottom:12px}
    .help{font-size:.88rem;margin-bottom:26px}

    /* 16px mínimo: por debajo, iOS hace zoom al enfocar el campo */
    .field{font-size:16px;padding:9px 2px 12px}
    .ref .field{font-size:16px}
    .ref{grid-template-columns:1fr;gap:12px;margin-bottom:26px}

    /* escalas: 5 por fila, con área de toque cómoda */
    .scale{gap:7px}
    .dot{flex:1 1 17%;min-width:0;height:50px;font-size:.95rem}
    .mrow{margin-bottom:22px;padding-bottom:20px}
    .mrow .lbl{margin-bottom:11px;font-size:10.5px;letter-spacing:.14em}
    .mrow .scale{gap:6px}
    .mrow .dot{flex:1 1 17%;height:44px;font-size:.85rem}
    .scale-legend{font-size:9.5px;letter-spacing:.1em;gap:12px}

    .opt-btn{padding:16px;font-size:.94rem}

    .actions{gap:14px;margin-top:28px}
    .go{flex:1 1 100%;padding:16px 24px;font-size:.95rem}
    .hint{flex:1 1 100%;text-align:center}
    .skip{flex:1 1 100%;text-align:center}

    .footbar{
      padding:16px 20px calc(18px + env(safe-area-inset-bottom));
      gap:14px;
    }
    .nav button{width:40px;height:36px;font-size:13px}
    .steps{min-width:48px;font-size:10px}
  }

  @media (max-width:360px){
    .q{font-size:1.2rem}
    .dot{height:46px;font-size:.88rem}
    .mrow .dot{height:40px;font-size:.78rem}
  }

  @media (prefers-reduced-motion:reduce){
    .card.enter,.card.leave{animation:none}
    .bar .fill{transition:none}
    .go:hover,.dot:hover{transform:none}
  }
</style>
</head>

</div>

<div class="stage" id="stage">
  <div class="card enter" id="card"></div>
</div>

<div class="footbar">
  <div class="bar"><div class="fill" id="fill"></div></div>
  <span class="steps" id="steps"></span>
  <div class="nav">
    <button id="prev" aria-label="Anterior" title="Anterior">&#9650;</button>
    <button id="next" aria-label="Siguiente" title="Siguiente">&#9660;</button>
  </div>
</div>

  var SPEAKERS = [

    "Ismael Cala",

  var PRODUCCION = [

    "Comida",
    "Coffee breaks",
    "Manejo de los tiempos",
    "Sonido y audiovisuales"
  ];

  var Q = [
    { id:"welcome", type:"welcome" },

    { id:"encanto", sec:"01 · Tu experiencia", type:"textarea", req:true,
      q:"Cuéntanos algo que te encantó del evento.",
      help:"Un momento, una frase, una conversación. Lo primero que se te venga a la cabeza suele ser lo más honesto.",
      ph:"Lo que no se te ha borrado desde que volviste" },

    { id:"expectativa", sec:"01 · Tu experiencia", type:"choice", req:true,
      q:"¿El evento cumplió lo que esperabas?",
      options:["Superó lo que esperaba","Cumplió lo que esperaba","Se quedó corto"] }
  ];

  SPEAKERS.forEach(function(name, n){
    Q.push({
      id:"sp_" + n, sec:"02 · Speakers", type:"scale", speakerIndex:n,
      q:name, help:"Del 1 al 10, ¿qué tanto te aportó?"

  Q.push(
    { id:"produccion", sec:"03 · Producción", type:"multiscale",
      items:PRODUCCION.slice(0,3), offset:0, req:true,
      q:"¿Cómo estuvo la logística?",

      q:"Recomienda personas para la próxima edición.",
      help:"Indica 3 personas que estarían alineadas con la propuesta del Mastermind Million y sus usuarios de Instagram." },

    { id:"done", type:"done" }
  );

  var card    = document.getElementById("card");
  var fill    = document.getElementById("fill");
  var steps   = document.getElementById("steps");
  var btnPrev = document.getElementById("prev");
  var btnNext = document.getElementById("next");

  function position(){
    var count = 0, total = 0;
    Q.forEach(function(q, idx){
      if(q.type === "welcome" || q.type === "done") return;
      total++;
      if(idx <= i) count++;
    });
    return { n:count, total:total };
  }

  function render(){
    var q = Q[i];
    card.innerHTML = "";
    card.classList.remove("enter");
    void card.offsetWidth;
    card.classList.add("enter");

    if(q.type === "welcome")        renderWelcome();
    else if(q.type === "done")      renderDone();
    else if(q.type === "scale")      renderScale(q);
    else if(q.type === "multiscale") renderMultiScale(q);
    else if(q.type === "choice")     renderChoice(q);
    else if(q.type === "multi")      renderMulti(q);
    else if(q.type === "referrals")  renderReferrals(q);
    else                            renderText(q);

    updateFoot();
  }

  function head(q, extra){
    var pos = position();
    return '<div class="eyebrow"><span class="lux-text">' + (q.sec||"") + '</span>' +
             '<span class="rule"></span><span>' + (extra || (pos.n + " / " + pos.total)) + '</span></div>' +
           '<h2 class="q">' + q.q + (q.req ? '' : '<span class="opt">Opcional</span>') + '</h2>' +
           '<p class="help">' + (q.help||"") + '</p>';

        '<span class="hint"><kbd>Shift</kbd> + <kbd>Enter</kbd> para saltar de línea</span>' +
        (q.req ? '' : '<button class="skip" id="skip">Saltar</button>') +
      '</div><div class="error" id="err"></div>';

    var input = document.getElementById("input");
    if(A[q.id]) input.value = A[q.id];

    function grow(){
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 260) + "px";
      input.style.overflowY = input.scrollHeight > 260 ? "auto" : "hidden";
    }
    grow();
    input.addEventListener("input", grow);

    setTimeout(function(){ input.focus(); grow(); }, 60);
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); advance(); }
    });
    document.getElementById("ok").onclick = advance;
    var s = document.getElementById("skip");
    if(s) s.onclick = function(){ delete A[q.id]; go(1); };
  }

  function renderScale(q){
    var dots = '<div class="scale" role="radiogroup">';
    for(var n = 1; n <= 10; n++){
      dots += '<button class="dot" role="radio" aria-checked="' + (A[q.id] == n) + '" data-v="' + n + '">' + n + '</button>';
    }
    dots += '</div><div class="scale-legend"><span>1 · No me aportó</span><span>10 · Me voló la cabeza</span></div>';

    card.innerHTML = head(q, "Speaker " + (q.speakerIndex + 1) + " de " + SPEAKERS.length) + dots +
      '<div class="actions">' +
        '<button class="skip" id="skip">No lo vi</button>' +
      '</div><div class="error" id="err"></div>';

    card.querySelectorAll(".dot").forEach(function(b){
      b.addEventListener("click", function(){ pickScale(q, b); });
    });
    document.getElementById("skip").onclick = function(){ A[q.id] = "No lo vi"; go(1); };
  }

  function pickScale(q, btn){
    card.querySelectorAll(".dot").forEach(function(b){ b.setAttribute("aria-checked","false"); });
    btn.setAttribute("aria-checked","true");
    A[q.id] = btn.dataset.v;
    setTimeout(function(){ go(1); }, 240);
  }

  function renderChoice(q){
    var opts = '<div class="opts" role="radiogroup">';
    q.options.forEach(function(o, n){
      opts += '<button class="opt-btn" role="radio" aria-checked="' + (A[q.id] === o) + '" data-v="' +
              o.replace(/"/g,'&quot;') + '"><span class="key">' + String.fromCharCode(65+n) + '</span><span>' + o + '</span></button>';
    });
    opts += '</div>';
    card.innerHTML = head(q) + opts +
      '<div class="actions"><span class="hint">elige con <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd></span></div>' +
      '<div class="error" id="err"></div>';
    card.querySelectorAll(".opt-btn").forEach(function(b){
      b.addEventListener("click", function(){ pickChoice(q, b); });
    });
  }

  function pickChoice(q, btn){
    card.querySelectorAll(".opt-btn").forEach(function(b){ b.setAttribute("aria-checked","false"); });
    btn.setAttribute("aria-checked","true");
    A[q.id] = btn.dataset.v;
    setTimeout(function(){ go(1); }, 240);
  }

  function renderMulti(q){
    var sel = A[q.id] ? A[q.id].split(" · ") : [];
    var opts = '<div class="opts" role="group">';
    q.options.forEach(function(o, n){
      opts += '<button class="opt-btn" role="checkbox" aria-checked="' + (sel.indexOf(o) > -1) + '" data-v="' +
              o.replace(/"/g,'&quot;') + '"><span class="key">' + String.fromCharCode(65+n) + '</span><span>' + o + '</span></button>';
    });
    opts += '</div>';
    card.innerHTML = head(q) + opts +
      '<div class="actions">' +
        '<button class="go" id="ok">Siguiente</button>' +
        '<span class="hint">puedes elegir varios</span>' +
      '</div><div class="error" id="err"></div>';

    card.querySelectorAll(".opt-btn").forEach(function(b){
      b.addEventListener("click", function(){
        b.setAttribute("aria-checked", b.getAttribute("aria-checked") === "true" ? "false" : "true");
        saveMulti(q);
      });
    });
    document.getElementById("ok").onclick = advance;
  }

  function saveMulti(q){
    var picked = [];
    card.querySelectorAll('.opt-btn[aria-checked="true"]').forEach(function(b){ picked.push(b.dataset.v); });
    A[q.id] = picked.join(" · ");
  }

  function renderMultiScale(q){
    var rows = "";
    q.items.forEach(function(item, n){
      var key = q.id + "_" + ((q.offset || 0) + n);
      rows += '<div class="mrow"><span class="lbl">' + item + '</span><div class="scale" data-key="' + key + '">';
      for(var v = 1; v <= 10; v++){
        rows += '<button class="dot" role="radio" aria-checked="' + (A[key] == v) + '" data-v="' + v + '">' + v + '</button>';
      }
      rows += '</div></div>';
    });
    card.innerHTML = head(q) + rows +
      '<div class="actions"><button class="go" id="ok">Siguiente</button>' +
      (q.req ? '' : '<button class="skip" id="skip">Saltar</button>') + '</div>' +
      '<div class="error" id="err"></div>';

    card.querySelectorAll(".mrow .scale").forEach(function(row){
      row.querySelectorAll(".dot").forEach(function(b){
        b.addEventListener("click", function(){
          row.querySelectorAll(".dot").forEach(function(x){ x.setAttribute("aria-checked","false"); });
          b.setAttribute("aria-checked","true");
          A[row.dataset.key] = b.dataset.v;
        });
      });
    });
    document.getElementById("ok").onclick = advance;
    var sk = document.getElementById("skip");
    if(sk) sk.onclick = function(){ go(1); };
  }

  function renderReferrals(q){
    var rows = "";
    for(var n = 1; n <= 3; n++){
      rows +=
        '<div class="ref">' +
          '<span class="n lux-text">Persona ' + n + '</span>' +
          '<input class="field" id="rn' + n + '" type="text" placeholder="Nombre y apellido">' +
          '<input class="field" id="ri' + n + '" type="text" placeholder="@usuario">' +
        '</div>';
    }
    card.innerHTML = head(q) + rows +
      '<div class="actions">' +
        '<button class="go" id="ok">Enviar encuesta</button>' +
        '<button class="skip" id="skip">No se me ocurre nadie ahora</button>' +
      '</div><div class="error" id="err"></div>';

    for(var k = 1; k <= 3; k++){
      if(A["ref" + k + "_n"]) document.getElementById("rn" + k).value = A["ref" + k + "_n"];
      if(A["ref" + k + "_i"]) document.getElementById("ri" + k).value = A["ref" + k + "_i"];
    }
    setTimeout(function(){ document.getElementById("rn1").focus(); }, 60);
    document.getElementById("ok").onclick = advance;
    document.getElementById("skip").onclick = function(){ go(1); };
  }

  var SHEET_FIELD_ORDER = [
    "encanto","expectativa",
    "sp_0","sp_1","sp_2","sp_3","sp_4","sp_5","sp_6","sp_7","sp_8","sp_9","sp_10","sp_11","sp_12",
    "produccion_0","produccion_1","produccion_2","produccion_3","produccion_4",
    "mejorar",
    "ref1_n","ref1_i","ref2_n","ref2_i","ref3_n","ref3_i"
  ];

  function submitToSheet(){
    if(!SHEET_WEBAPP_URL || submitted) return;
    submitted = true;

    var payload = { timestamp: new Date().toISOString() };
    SHEET_FIELD_ORDER.forEach(function(key){ payload[key] = A[key] || ""; });

    try{
      fetch(SHEET_WEBAPP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
    }catch(e){}
  }

      '<div class="kicker lux-text">Encuesta enviada</div>' +
      '<h1 class="title">Gracias.<br><span class="lux-text">Leeremos tus respuestas.</span></h1>' +
      '<div class="actions">' +
        '<button class="skip" id="restart">Empezar de nuevo</button>' +
      '</div>';
    document.getElementById("restart").onclick = function(){ A = {}; i = 0; render(); };
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];
    });
  }

  function advance(){
    var q = Q[i];
    if(q.type === "welcome"){ go(1); return; }
    if(q.type === "done") return;

    if(q.type === "referrals"){
      for(var n = 1; n <= 3; n++){
        A["ref" + n + "_n"] = document.getElementById("rn" + n).value.trim();
        A["ref" + n + "_i"] = document.getElementById("ri" + n).value.trim();
      }
      go(1); return;
    }

    if(q.type === "multiscale"){
      if(q.req){
        var faltan = q.items.some(function(_, n){ return !A[q.id + "_" + ((q.offset||0) + n)]; });
        if(faltan){ document.getElementById("err").textContent = "Califica los tres aspectos para continuar."; return; }
      }
      go(1); return;
    }

    if(q.type === "multi"){ saveMulti(q); go(1); return; }

    if(q.type === "choice"){
      if(!A[q.id]){ document.getElementById("err").textContent = "Elige una opción para continuar."; return; }
      go(1); return;
    }

    if(q.type === "scale"){
      if(!A[q.id]){ document.getElementById("err").textContent = "Elige un número o marca “No lo vi”."; return; }
      go(1); return;
    }

    var input = document.getElementById("input");
    if(input) A[q.id] = input.value.trim();
    if(q.req && !A[q.id]){
      document.getElementById("err").textContent = "Esta la necesitamos. Con una línea basta.";
      if(input) input.focus();
      return;
    }
    go(1);
  }

  function go(dir){
    var n = i + dir;
    if(n < 0 || n >= Q.length) return;
    card.classList.add("leave");
    setTimeout(function(){
      card.classList.remove("leave");
      i = n;
      render();
    }, 160);
  }

  function updateFoot(){
    var q = Q[i], pos = position();
    var pct = q.type === "welcome" ? 0 : (q.type === "done" ? 1 : pos.n / pos.total);
    fill.style.width = (pct * 100) + "%";
    steps.textContent = (q.type === "welcome" || q.type === "done") ? "" : pos.n + " / " + pos.total;
    btnPrev.disabled = i === 0;
    btnNext.disabled = q.type === "done";
  }

  btnPrev.onclick = function(){ go(-1); };
  btnNext.onclick = advance;

  document.addEventListener("keydown", function(e){
    var q = Q[i];
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    var typing = tag === "INPUT" || tag === "TEXTAREA";

    if(e.key === "Enter" && !typing && !e.shiftKey){ e.preventDefault(); advance(); return; }

    if(q && (q.type === "choice" || q.type === "multi") && !typing && /^[a-zA-Z]$/.test(e.key)){
      var n = e.key.toUpperCase().charCodeAt(0) - 65;
      var opts = card.querySelectorAll(".opt-btn");
      if(opts[n]){
        e.preventDefault();
        if(q.type === "choice") pickChoice(q, opts[n]);
        else { opts[n].setAttribute("aria-checked", opts[n].getAttribute("aria-checked") === "true" ? "false" : "true"); saveMulti(q); }
      }
      return;
    }

    if(q && q.type === "scale" && !typing && /^[0-9]$/.test(e.key)){
      var v = e.key === "0" ? 10 : parseInt(e.key, 10);
      var list = card.querySelectorAll(".dot");
      if(list[v - 1]){ e.preventDefault(); pickScale(q, list[v - 1]); }
    }
  });

  render();
})();
