<style>
  :root{
    --black:#000000;
    --black-soft:#0A0A0A;
    --gold:#D4A362;
    --gold-deep:#B17F40;
    --gold-light:#E8D9AE;
    --gold-dim:rgba(212,163,98,.20);
    --white:#F5F5F3;
    --muted:#8A8A86;
    --err:#C4553E;
    --display:"Poppins", -apple-system, system-ui, sans-serif;
    --body:"Montserrat", -apple-system, system-ui, sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--black);
    color:var(--white);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  h1,h2,h3,.display{font-family:var(--display)}

  .gold-text{
    background:linear-gradient(135deg,#B17F40 0%,#D4A362 45%,#E8D9AE 70%,#D4A362 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* faint gold light from the top-left, like a lamp on a dark table */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(60vw 50vh at 50% -10%, rgba(212,163,98,.14), transparent 60%),
      radial-gradient(50vw 40vh at 100% 110%, rgba(212,163,98,.06), transparent 65%);
    pointer-events:none;
    z-index:0;
  }

  /* subtle grain, matches the main site's noise texture */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.03;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    z-index:0;
  }

  .particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .particles span{
    position:absolute;
    border-radius:999px;
    background:var(--gold-light);
    opacity:.18;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translate3d(0,0,0);opacity:.08}
    50%{transform:translate3d(6px,-22px,0);opacity:.3}
    100%{transform:translate3d(0,0,0);opacity:.08}
  }

  .stage{
    position:relative;
    z-index:1;
    height:100%;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:104px 32px 140px;
    overflow-y:auto;
  }

  .card{
    width:100%;
    max-width:680px;
  }

  .card.enter{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .card.leave{animation:sink .22s ease-in both}

  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes sink{from{opacity:1}to{opacity:0;transform:translateY(-14px)}}

  /* ---------- header ---------- */
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 32px;
    font-family:var(--body);
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--muted);
    background:linear-gradient(to bottom, rgba(0,0,0,.9), transparent);
  }
  .brand{display:flex;align-items:center;gap:10px;color:var(--white)}
  .brand img{height:24px;width:auto;display:block}
  .brand b{font-family:var(--display);font-weight:600;letter-spacing:.08em;font-size:12px;color:var(--gold-light)}
  .dates{color:var(--muted)}

  /* ---------- question ---------- */
  .eyebrow{
    font-family:var(--body);
    font-size:11px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:26px;
  }
  .eyebrow .rule{flex:1;height:1px;background:var(--gold-dim);max-width:120px}

  .q{
    font-family:var(--display);
    font-weight:500;
    font-size:clamp(1.4rem, 3.4vw, 2.05rem);
    line-height:1.2;
    letter-spacing:-.01em;
    margin-bottom:16px;
  }
  .q .opt{
    font-family:var(--body);
    font-size:11px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    vertical-align:middle;
    margin-left:12px;
    border:1px solid var(--gold-dim);
    border-radius:999px;
    padding:3px 10px;
  }
  .help{
    font-size:.94rem;
    line-height:1.6;
    color:var(--muted);
    margin-bottom:34px;
    max-width:52ch;
  }
  .help:empty{display:none;margin:0}

  /* ---------- text fields ---------- */
  .field{
    width:100%;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--gold-dim);
    color:var(--white);
    font-family:var(--body);
    font-size:clamp(1.05rem,2.4vw,1.3rem);
    padding:10px 2px 14px;
    outline:none;
    transition:border-color .25s ease;
  }
  .field::placeholder{color:#4A473F}
  .field:focus{border-bottom-color:var(--gold)}
  textarea.field{resize:none;min-height:104px;line-height:1.5}

  .phone-row{display:flex;gap:14px;align-items:flex-end}
  .phone-row select{
    flex:0 0 auto;
    max-width:132px;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--gold-dim);
    color:var(--white);
    font-family:var(--body);
    font-size:clamp(1rem,2.2vw,1.2rem);
    padding:10px 2px 14px;
    outline:none;
    cursor:pointer;
    transition:border-color .25s ease;
  }
  .phone-row select:focus{border-bottom-color:var(--gold)}
  .phone-row select option{background:var(--black-soft);color:var(--white)}
  .phone-row .field{flex:1}

  /* ---------- choices ---------- */
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    text-align:left;
    background:var(--black-soft);
    border:1px solid var(--gold-dim);
    border-radius:14px;
    color:var(--white);
    font-family:var(--body);
    font-size:1rem;
    padding:16px 18px;
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .choice:hover{border-color:rgba(212,163,98,.55);box-shadow:0 0 30px rgba(212,163,98,.12);transform:translateY(-1px)}
  .choice:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .choice .key{
    font-family:var(--body);
    font-weight:600;
    font-size:11px;
    letter-spacing:.04em;
    width:24px;height:24px;
    flex:none;
    display:grid;place-items:center;
    border:1px solid var(--gold-dim);
    border-radius:999px;
    color:var(--gold);
  }
  .choice[aria-checked="true"]{
    border-color:var(--gold);
    background:rgba(212,163,98,.12);
    box-shadow:0 0 30px rgba(212,163,98,.15);
  }
  .choice[aria-checked="true"] .key{background:var(--gold);border-color:var(--gold);color:#000}

  /* ---------- actions ---------- */
  .actions{display:flex;align-items:center;gap:18px;margin-top:34px;flex-wrap:wrap}

  @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
  .go{
    font-family:var(--body);
    font-weight:600;
    font-size:.95rem;
    letter-spacing:.02em;
    background:linear-gradient(110deg,var(--gold-deep) 0%,var(--gold) 25%,var(--gold-light) 50%,var(--gold) 75%,var(--gold-deep) 100%);
    background-size:200% auto;
    animation:shimmer 3s linear infinite;
    color:#000;
    border:0;
    border-radius:999px;
    padding:14px 28px;
    cursor:pointer;
    box-shadow:0 0 30px rgba(212,163,98,.25);
    transition:box-shadow .2s ease, transform .18s ease;
  }
  .go:hover{box-shadow:0 0 45px rgba(212,163,98,.4);transform:translateY(-1px)}
  .go:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px}
  .hint{font-family:var(--body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .hint kbd{border:1px solid var(--gold-dim);border-radius:4px;padding:2px 6px;color:var(--gold);font-family:var(--body)}
  .skip{
    background:none;border:0;color:var(--muted);
    font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    cursor:pointer;text-decoration:underline;text-underline-offset:4px;
  }
  .skip:hover{color:var(--gold)}

  .error{
    color:var(--err);
    font-size:.85rem;
    margin-top:14px;
    min-height:1.1em;
    font-family:var(--body);
    letter-spacing:.02em;
  }

  /* ---------- footer: progress bar + nav ---------- */
  .footbar{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:3;
    padding:20px 32px 22px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    background:linear-gradient(to top, var(--black) 55%, transparent);
  }
  .progress{font-family:var(--body);line-height:1;min-width:200px;flex:1;max-width:320px}
  .progress .label{
    display:block;
    font-size:10px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .progress-track{
    width:100%;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0;
    border-radius:999px;
    background:linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-light));
    box-shadow:0 0 12px rgba(212,163,98,.5);
    transition:width .5s cubic-bezier(.2,.7,.3,1);
  }

  .nav{display:flex;align-items:center;gap:10px}
  .nav button{
    width:36px;height:32px;
    background:transparent;
    border:1px solid var(--gold-dim);
    border-radius:8px;
    color:var(--gold);
    cursor:pointer;
    font-size:13px;
    transition:border-color .18s ease,background .18s ease;
  }
  .nav button:hover:not(:disabled){border-color:var(--gold);background:rgba(212,163,98,.09)}
  .nav button:disabled{opacity:.3;cursor:default}
  .steps{font-family:var(--body);font-size:11px;letter-spacing:.1em;color:var(--muted);margin-right:6px}

  /* ---------- welcome & closing ---------- */
  .kicker{
    font-family:var(--body);
    font-size:11px;
    font-weight:600;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:22px;
  }
  .title{
    font-weight:500;
    font-size:clamp(2rem,5.6vw,3.3rem);
    line-height:1.08;
    letter-spacing:-.01em;
    margin-bottom:24px;
  }
  .title em{font-style:normal;font-weight:700}
  .lede{font-size:1.02rem;line-height:1.65;color:#B9B4AA;max-width:50ch;margin-bottom:16px}
  .meta{
    font-family:var(--body);
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    border-top:1px solid var(--gold-dim);
    padding-top:16px;
    margin-top:30px;
    display:flex;
    gap:26px;
    flex-wrap:wrap;
  }
  .meta span b{color:var(--gold);font-weight:600}

  .ghost{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:999px;
    padding:12px 22px;
    font-family:var(--body);
    font-size:.9rem;
    font-weight:600;
    cursor:pointer;
    transition:background .18s ease;
  }
  .ghost:hover{background:rgba(212,163,98,.1)}

  @media (max-width:640px){
    .stage{padding:88px 22px 132px;align-items:flex-start}
    .topbar{padding:18px 22px}
    .dates{display:none}
    .footbar{padding:16px 22px 18px}
    .progress .label{margin-bottom:6px}
    .progress{max-width:none}
    .actions{gap:14px}
    .choice{padding:15px 16px}
  }

  @media (prefers-reduced-motion:reduce){
    .card.enter,.card.leave{animation:none}
    .progress-fill{transition:none}
    .go:hover{transform:none}
    .go{animation:none}
    .particles span{animation:none;opacity:.15}
  }
</style>
</head>

    var spots = [
      {l:"6%",t:"18%",s:3,d:9,delay:0},{l:"14%",t:"72%",s:2,d:11,delay:1.2},
      {l:"22%",t:"40%",s:4,d:8,delay:.4},{l:"31%",t:"85%",s:2,d:10,delay:2},
      {l:"38%",t:"12%",s:3,d:12,delay:.8},{l:"47%",t:"55%",s:2,d:9,delay:1.6},
      {l:"55%",t:"28%",s:4,d:10,delay:.2},{l:"63%",t:"78%",s:2,d:11,delay:2.4},
      {l:"71%",t:"16%",s:3,d:8,delay:1},{l:"79%",t:"62%",s:2,d:13,delay:.6},
      {l:"86%",t:"34%",s:4,d:9,delay:1.8},{l:"92%",t:"88%",s:2,d:10,delay:.3}
    ];
    spots.forEach(function(p){
      var el = document.createElement("span");
      el.style.left = p.l; el.style.top = p.t;
      el.style.width = p.s + "px"; el.style.height = p.s + "px";
      el.style.animationDuration = p.d + "s";
      el.style.animationDelay = p.delay + "s";
      host.appendChild(el);
    });
  })();

  function visible(idx){
    var q = QUESTIONS[idx];
    if(!q) return false;
    if(q.showIf && !q.showIf()) return false;
    return true;
  }
  function isLastQuestion(idx){
    var n = idx + 1;
    while(n < QUESTIONS.length && !visible(n)) n++;
    return !QUESTIONS[n] || QUESTIONS[n].type === "done";
  }
  function position(){
    var count = 0, total = 0;
    QUESTIONS.forEach(function(q,idx){
      if(q.type==="welcome"||q.type==="done") return;
      if(!visible(idx)) return;
      total++;
      if(idx <= i) count++;
    });
    return {n:Math.max(count,0), total:total};
  }

  /* ---------- render ---------- */
  function render(){
    var q = QUESTIONS[i];
    card.innerHTML = "";
    card.classList.remove("enter");
    void card.offsetWidth;
    card.classList.add("enter");

    if(q.type === "welcome")      renderWelcome();
    else if(q.type === "done")    renderDone();
    else if(q.type === "decline") renderDecline();
    else                          renderQuestion(q);

    updateFoot();
  }

  function renderWelcome(){
    var hasProgress = resumeIndex > 0;
    card.innerHTML =
      '<div class="kicker">Tu lugar está confirmado</div>' +
      '<h1 class="title">Haz tu<br><em class="gold-text">Check In</em></h1>' +
      '<p class="lede">Este check-in te toma unos minutos y es lo que nos permite prepararte una experiencia a tu medida antes de que nos veamos en CDMX.</p>' +
      '<p class="lede">Contesta con calma. Nadie más lee tus respuestas.</p>' +
      '<div class="actions">' +
        '<button class="go" id="start">' + (hasProgress ? "Continuar" : "Empezar") + '</button>' +
        '<span class="hint">o presiona <kbd>Enter</kbd> &nbsp;↵</span>' +
      '</div>' +
      '<div class="meta">' +
        '<span><b>Fecha límite</b> &nbsp;Miércoles 26 de agosto</span>' +
        '<span><b>Sede</b> &nbsp;NH Collection Reforma, CDMX</span>' +
      '</div>';
    document.getElementById("start").onclick = function(){
      if(hasProgress){ jumpTo(resumeIndex); } else { go(1); }
    };
  }

  function renderQuestion(q){
    var pos = position();
    var head =
      '<div class="eyebrow"><span>' + (q.sec || "") + '</span><span class="rule"></span>' +
        '<span>' + pos.n + ' / ' + pos.total + '</span></div>' +
      '<h2 class="q">' + q.q + (q.optional ? '<span class="opt">Opcional</span>' : '') + '</h2>' +
      '<p class="help">' + (q.help || "") + '</p>';

    var bodyHtml = "";
    if(q.type === "choice"){
      bodyHtml = '<div class="choices" role="radiogroup">';
      q.options.forEach(function(o, n){
        var letter = String.fromCharCode(65 + n);
        var on = A[q.id] === o.v;
        bodyHtml += '<button class="choice" role="radio" aria-checked="' + on + '" data-v="' +
          o.v.replace(/"/g,'&quot;') + '" data-declines="' + (!!o.declines) + '">' +
          '<span class="key">' + letter + '</span><span>' + o.v + '</span></button>';
      });
      bodyHtml += '</div>';
    } else if(q.type === "textarea"){
      bodyHtml = '<textarea class="field" id="input" rows="3" placeholder="' + (q.ph||"") + '"></textarea>';
    } else if(q.type === "phone"){
      var savedDial = "+52", savedNumber = "";
      if(A[q.id]){
        var parts = A[q.id].split(" ");
        savedDial = parts[0];
        savedNumber = parts.slice(1).join(" ");
      }
      bodyHtml = '<div class="phone-row">' +
        '<select id="dial">' + DIAL_CODES.map(function(c){
          return '<option value="' + c.code + '"' + (c.code === savedDial ? ' selected' : '') + '>' +
            c.flag + ' ' + c.code + '</option>';
        }).join("") + '</select>' +
        '<input class="field" id="input" type="tel" placeholder="' + (q.ph||"") + '" value="' + savedNumber.replace(/"/g,'&quot;') + '">' +
      '</div>';
    } else if(q.type === "ampm"){
      var savedHour = "", savedMeridiem = "AM";
      if(A[q.id]){
        var hParts = A[q.id].split(" ");
        savedMeridiem = hParts.pop();
        savedHour = hParts.join(" ");
      }
      bodyHtml = '<div class="phone-row">' +
        '<input class="field" id="input" type="text" placeholder="' + (q.ph||"") + '" value="' + savedHour.replace(/"/g,'&quot;') + '">' +
        '<select id="meridiem">' +
          '<option value="AM"' + (savedMeridiem === "AM" ? ' selected' : '') + '>AM</option>' +
          '<option value="PM"' + (savedMeridiem === "PM" ? ' selected' : '') + '>PM</option>' +
        '</select>' +
      '</div>';
    } else {
      bodyHtml = '<input class="field" id="input" type="text" placeholder="' + (q.ph||"") + '">';
    }

    var isChoice = q.type === "choice";
    var isLast = isLastQuestion(i);
    var actions =
      '<div class="actions">' +
        '<button class="go" id="ok">' + (isLast ? "Enviar" : "Siguiente") + '</button>' +
        '<button class="skip" id="back">&larr; Volver</button>' +
        (isChoice
          ? '<span class="hint">elige con <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd></span>'
          : '<span class="hint">presiona <kbd>Enter</kbd> &nbsp;↵</span>') +
        (q.req ? '' : '<button class="skip" id="skip">Saltar</button>') +
      '</div>' +
      '<div class="error" id="err"></div>';

    card.innerHTML = head + bodyHtml + actions;

    var input = document.getElementById("input");
    if(input){
      if(A[q.id] && q.type !== "phone" && q.type !== "ampm") input.value = A[q.id];
      setTimeout(function(){ input.focus(); }, 60);
      input.addEventListener("keydown", function(e){
        if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); advance(); }
      });
    }

    card.querySelectorAll(".choice").forEach(function(b){
      b.addEventListener("click", function(){ pickChoice(q, b); });
    });

    document.getElementById("ok").onclick = advance;
    document.getElementById("back").onclick = function(){ go(-1); };
    var skip = document.getElementById("skip");
    if(skip) skip.onclick = function(){ delete A[q.id]; persist(); go(1); };
  }

  function pickChoice(q, btn){
    card.querySelectorAll(".choice").forEach(function(b){ b.setAttribute("aria-checked","false"); });
    btn.setAttribute("aria-checked","true");
    A[q.id] = btn.dataset.v;
    declined = btn.dataset.declines === "true";
    persist();
    setTimeout(advance, 260);
  }

  function renderDecline(){
    card.innerHTML =
      '<div class="eyebrow"><span>Sin problema</span><span class="rule"></span></div>' +
      '<h2 class="q">Gracias por avisarnos a tiempo.</h2>' +
      '<p class="help">Liberamos tu lugar. Si quieres, cuéntanos qué pasó: nos ayuda a mejorar la próxima edición.</p>' +
      '<textarea class="field" id="input" rows="3" placeholder="Opcional"></textarea>' +
      '<div class="actions"><button class="go" id="ok">Enviar</button></div>';
    document.getElementById("ok").onclick = function(){
      A.motivo = document.getElementById("input").value.trim();
      persist();
      i = QUESTIONS.length - 1;
      render();
    };
    setTimeout(function(){ document.getElementById("input").focus(); }, 60);
  }

  function renderDone(){
    submitToSheet();
    clearPersisted();

    card.innerHTML =
      '<div class="kicker">Check-in completo</div>' +
      '<h1 class="title">' + (declined
          ? 'Nos vemos<br><em class="gold-text">en la próxima.</em>'
          : 'Listo.<br><em class="gold-text">Nos vemos el 29.</em>') + '</h1>' +
      '<p class="lede">' + (declined
          ? 'Ya registramos tu cambio de planes. Si necesitas resolver algo más, escríbenos a soporte.'
          : 'Por el grupo de WhatsApp vamos a compartir la agenda detallada, las indicaciones de llegada al NH Collection Reforma y cualquier actualización de último momento. Si aún no estás dentro, únete con el botón de abajo.') + '</p>' +
      '<div class="actions">' +
        (declined
          ? ''
          : '<button class="go" id="group">Ir al grupo de WhatsApp</button>') +
        '<button class="ghost" id="support">Contactar a soporte</button>' +
      '</div>';

    var groupBtn = document.getElementById("group");
    if(groupBtn) groupBtn.onclick = function(){
      window.open(WHATSAPP_GROUP_URL, "_blank", "noopener");
    };
    document.getElementById("support").onclick = function(){
      window.open(SUPPORT_WHATSAPP_URL, "_blank", "noopener");
    };
  }

  /* ---------- navegación ---------- */
  function advance(){
    var q = QUESTIONS[i];

    if(q.type === "welcome"){ go(1); return; }
    if(q.type === "done" || q.type === "decline") return;

    var input = document.getElementById("input");
    if(input){
      var val = input.value.trim();
      if(q.type === "phone" && val){
        var dial = document.getElementById("dial");
        val = dial.value + " " + val;
      }
      if(q.type === "ampm" && val){
        var meridiem = document.getElementById("meridiem");
        val = val + " " + meridiem.value;
      }
      A[q.id] = val;
    }

    if(q.req && !A[q.id]){
      var err = document.getElementById("err");
      if(err) err.textContent = q.type === "choice"
        ? "Elige una opción para continuar."
        : "Esta respuesta la necesitamos para prepararte todo.";
      if(input) input.focus();
      return;
    }

    persist();

    if(q.id === "dias" && declined){ i = indexOfDecline(); render(); return; }

    go(1);
  }

  function indexOfDecline(){
    // inserta la pantalla de baja justo antes del cierre
    var idx = QUESTIONS.findIndex(function(x){ return x.type === "decline"; });
    if(idx === -1){
      QUESTIONS.splice(QUESTIONS.length - 1, 0, {id:"decline", type:"decline"});
      idx = QUESTIONS.length - 2;
    }
    return idx;
  }

  function go(dir){
    var n = i + dir;
    while(n > 0 && n < QUESTIONS.length && !visible(n)) n += dir;
    if(n < 0 || n >= QUESTIONS.length) return;
    jumpTo(n);
  }

  function jumpTo(idx){
    if(idx < 0 || idx >= QUESTIONS.length) return;
    card.classList.add("leave");
    setTimeout(function(){
      card.classList.remove("leave");
      i = idx;
      resumeIndex = 0;
      persist();
      render();
    }, 160);
  }

  function updateFoot(){
    var pos = position();
    var q = QUESTIONS[i];
    var pct = q.type === "welcome" ? 0 : (q.type === "done" ? 1 : pos.n / pos.total);
    fill.style.width = (pct * 100) + "%";
    steps.textContent = (q.type === "welcome" || q.type === "done") ? "" : pos.n + " / " + pos.total;
    btnPrev.disabled = i === 0;
    btnNext.disabled = q.type === "done";
  }

  btnPrev.onclick = function(){ go(-1); };
  btnNext.onclick = advance;

  document.addEventListener("keydown", function(e){
    var q = QUESTIONS[i];
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    var typing = tag === "INPUT" || tag === "TEXTAREA";

    if(e.key === "Enter" && !typing && !e.shiftKey){ e.preventDefault(); advance(); return; }

    if(q && q.type === "choice" && !typing){
      var idx = e.key.toUpperCase().charCodeAt(0) - 65;
      var list = card.querySelectorAll(".choice");
      if(idx >= 0 && idx < list.length){ e.preventDefault(); pickChoice(q, list[idx]); }
    }
  });

  /* ---------- arranque: retoma progreso guardado si existe ---------- */
  (function init(){
    var saved = loadPersisted();
    if(saved && saved.A && Object.keys(saved.A).length){
      A = saved.A || {};
      declined = !!saved.declined;
      // siempre arranca en welcome; el botón "Continuar" salta al índice guardado
      i = 0;
      resumeIndex = typeof saved.i === "number" && saved.i > 0 ? saved.i : 0;
    }
    render();
  })();
})();
</script>
</body>
</html>
